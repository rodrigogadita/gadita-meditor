<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{csp}}; script-src 'nonce-{{nonce}}'; img-src {{csp}} data:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{css}}">
<title>Gadita Meditor</title>
</head>
<body data-modo="{{modo}}">
<main id="app">
  <header class="topo">
    <div class="marca"><span class="pulso"></span>GADITA <b>MEDITOR</b></div>
    <div class="acoes-topo">
      <button id="flutuar" class="icone" title="Abrir em janela flutuante" aria-label="Abrir em janela flutuante">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="3.5" width="7" height="7"/><path d="M4.5 1.5h6v6"/></svg>
      </button>
      <button id="menu" class="icone" title="Onde abrir (flutuante, aba, lateral)" aria-label="Opções">
        <svg viewBox="0 0 12 12" fill="currentColor"><circle cx="2.5" cy="6" r="1.1"/><circle cx="6" cy="6" r="1.1"/><circle cx="9.5" cy="6" r="1.1"/></svg>
      </button>
      <button id="modo" class="icone" aria-label="Encolher ou expandir"></button>
    </div>
  </header>
  <div id="conteudo"><p class="vazio">Procurando sessões do Claude Code…</p></div>
</main>
<script nonce="{{nonce}}" src="{{js}}"></script>
</body>
</html>
